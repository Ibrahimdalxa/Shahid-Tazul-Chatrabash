<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHID TAZUL - Chhatrabash</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Hind Siliguri', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #182848);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ---------------- Welcome Screen Animation ---------------- */
        #welcomeScreen {
            position: fixed;
            inset: 0;
            background: #0f2027; /* Dark elegant background */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        .welcome-text p.w-small {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(20px);
            animation: textReveal 0.8s 0.2s forwards;
        }

        .welcome-text h1.w-title {
            font-size: 3rem;
            font-weight: 700;
            margin: 10px 0;
            background: linear-gradient(to right, #fff, #a0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: textReveal 0.8s 0.6s forwards;
        }

        .welcome-text p.w-sub {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: textReveal 0.8s 1s forwards;
        }

        @keyframes textReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------------- Glassmorphism Container ---------------- */
        .card-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            opacity: 0;
            animation: fadeInContainer 1s 3.5s forwards; /* Appears after welcome screen */
        }

        @keyframes fadeInContainer {
            to { opacity: 1; }
        }

        /* Header section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title-area h1 { 
            font-size: 2.2rem; font-weight: 700; letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .title-area p { 
            font-size: 1.2rem; font-weight: 300; color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase; letter-spacing: 2px;
        }

        .logo-box {
            width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo-box img { width: 65%; height: 65%; object-fit: contain; }

        /* Member Label */
        .members-label {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; padding: 6px 24px; font-size: 1.1rem;
            margin-bottom: 20px; font-weight: 600;
        }

        /* Member List */
        .member-list { display: flex; flex-direction: column; gap: 12px; }

        .member-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
            position: relative;
        }

        .member-box:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .member-main-info {
            display: flex; align-items: center; gap: 15px; flex: 1;
        }

        .member-photo-circle {
            width: 55px; height: 55px; border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; overflow: hidden; background: rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
        }

        .member-photo-circle img { width: 100%; height: 100%; object-fit: cover; }

        .name-and-phone { display: flex; flex-direction: column; }
        .name-text { font-size: 1.15rem; font-weight: 600; color: #ffffff; }
        .phone-text { font-size: 0.9rem; color: rgba(255, 255, 255, 0.6); }

        /* Direct Call Button in List */
        .call-action-btn {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #4CAF50;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .call-action-btn:hover {
            background: rgba(76, 175, 80, 0.8);
            color: #fff;
            transform: scale(1.1);
        }

        .call-action-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ---------------- Modal Slide Animation ---------------- */
        .modal-overlay {
            visibility: hidden; opacity: 0;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s;
            z-index: 1000;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-content {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px; border-radius: 24px;
            width: 90%; max-width: 360px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            
            /* Initial state: Slide from Left */
            transform: translateX(-100vw);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .modal-overlay.active .modal-content {
            /* Active state: Center */
            transform: translateX(0);
        }

        .modal-overlay.closing .modal-content {
            /* Closing state: Slide to Right */
            transform: translateX(100vw);
        }

        /* Modal Elements */
        .modal-photo-circle {
            width: 100px; height: 100px; border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; overflow: hidden; margin: 0 auto 20px auto;
            background: rgba(255, 255, 255, 0.1); box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .modal-photo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .modal-content h3 { margin-bottom: 20px; font-size: 1.5rem; color: #ffffff; }

        .info-block { 
            margin-bottom: 12px; text-align: left; background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .info-text-area { display: flex; flex-direction: column; }
        .info-label { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); font-weight: 600; text-transform: uppercase; }
        .info-value { font-size: 1.1rem; color: #ffffff; margin-top: 4px; font-weight: 400; }

        /* Modal Call Button */
        .btn-call-large {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px; margin-top: 10px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff; border: none; border-radius: 12px; font-size: 1.1rem;
            font-weight: 600; cursor: pointer; text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-call-large:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56, 239, 125, 0.4); }
        .btn-call-large svg { width: 22px; height: 22px; fill: #fff; }

        .btn-close {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.1); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 1rem;
            font-weight: 600; cursor: pointer; margin-top: 12px; transition: all 0.3s ease;
        }
        .btn-close:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }

    </style>
</head>
<body>

<!-- 1. Welcome Screen -->
<div id="welcomeScreen">
    <div class="welcome-text">
        <p class="w-small">Welcome to</p>
        <h1 class="w-title">SHAHID TAZUL</h1>
        <p class="w-sub">chhatrabash</p>
    </div>
</div>

<!-- Main App Container -->
<div class="card-container">
    <header class="header">
        <div class="title-area">
            <h1>SHAHID TAZUL</h1>
            <p>chhatrabash</p>
        </div>
        <div class="logo-box">
            <img src="https://cdn-icons-png.flaticon.com/128/17433/17433850.png" alt="Logo">
        </div>
    </header>

    <div class="members-label">Members</div>
    <div class="member-list" id="memberList"></div>
</div>

<!-- 3. Slide Left/Right Modal -->
<div class="modal-overlay" id="popupModal">
    <div class="modal-content">
        <div class="modal-photo-circle">
            <img id="mPhoto" src="" alt="Member Photo">
        </div>
        <h3 id="mNameDisplay"></h3>
        
        <div class="info-block">
            <div class="info-text-area">
                <span class="info-label">মোবাইল নম্বর</span> 
                <span class="info-value" id="mPhone"></span>
            </div>
        </div>
        
        <div class="info-block">
            <div class="info-text-area">
                <span class="info-label">রুম নম্বর</span> 
                <span class="info-value" id="mRoom">তথ্য নেই</span>
            </div>
        </div>

        <!-- 2. Direct Call Button inside Modal -->
        <a href="#" id="modalCallBtn" class="btn-call-large">
            <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
            কল করুন
        </a>

        <button class="btn-close" onclick="closeModal()">বন্ধ করুন</button>
    </div>
</div>

<script>
    // Handle Welcome Screen Animation
    window.addEventListener('load', () => {
        const welcomeScreen = document.getElementById('welcomeScreen');
        // Wait 3 seconds, then start fading out
        setTimeout(() => {
            welcomeScreen.style.opacity = '0';
            welcomeScreen.style.visibility = 'hidden';
            // Completely remove from DOM after transition
            setTimeout(() => {
                welcomeScreen.remove();
            }, 800);
        }, 3000);
    });

    const members = [
        { name: "কে এম ইমরান হুসাইন", phone: "+880 1743-248248", photo: "https://i.ibb.co.com/671ksQS3/525335176-1544032479914576-8298810793362339152-n.jpg", room: "উত্তর" },
        { name: "আব্দুল গফুর", phone: "+880 1300-254672", photo: "https://i.ibb.co.com/5xBr1yTt/Remove-background-replace-white-202605092338.jpg", room: "দক্ষিণ" },
        { name: "জহিরুল ইসলাম", phone: "+880 1778-975080", photo: "https://i.ibb.co.com/yFq5s4QR/688899946-122157134102965697-937530771562397178-n.jpg", room: "দক্ষিণ" },
        { name: "মোঃ তারেক", phone: "+880 1327-750275", photo: "https://i.ibb.co.com/gLXWJ4yC/tarek-web.webp", room: "পশ্চিম" },
        { name: "সজিব সরকার", phone: "+880 1928-853822", photo: "https://i.ibb.co.com/PGxvMNsh/mohamed-hassan-silk-8976449-1920.png", room: "পশ্চিম" },
        { name: "কামাল হোসেন", phone: "+880 1703-172757", photo: "https://i.ibb.co.com/PGxvMNsh/mohamed-hassan-silk-8976449-1920.png", room: "পশ্চিম" },
        { name: "তাহের হোসেন", phone: "+880 1806-419657", photo: "https://i.ibb.co.com/zHNN0Hg5/659207479-909852241951903-3531338251726889684-n.jpg", room: "দক্ষিণ" },
        { name: "মোঃ ইব্রাহীম খলিলুল্লাহ", phone: "+8801734365986", photo: "https://i.ibb.co.com/jPVp0RkV/untitled-Flux-Kontext-2026-04-29-18-47-40.png", room: "উত্তর" },
        { name: "আক্তার হুসাইন", phone: "+8801314196435", photo: "https://i.ibb.co.com/chpKGVK3/images.jpg", room: "" }
    ];

    const container = document.getElementById('memberList');

    members.forEach((member, index) => {
        const cleanPhone = member.phone.replace(/[^0-9+]/g, ''); // Clean space/dash for dialer
        const box = document.createElement('div');
        box.className = 'member-box';
        
        box.innerHTML = `
            <div class="member-main-info" onclick='openModal(${JSON.stringify(member)})'>
                <div class="member-photo-circle">
                    <img src="${member.photo}" alt="${member.name}" loading="lazy">
                </div>
                <div class="name-and-phone">
                    <span class="name-text">${member.name}</span>
                    <span class="phone-text">${member.phone}</span>
                </div>
            </div>
            <!-- Direct Call Link Button (stopPropagation prevents modal from opening) -->
            <a href="tel:${cleanPhone}" class="call-action-btn" onclick="event.stopPropagation();" title="কল করুন">
                <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
            </a>
        `;
        container.appendChild(box);
    });

    const modal = document.getElementById('popupModal');

    function openModal(member) {
        if(member.name === "খালি") return;
        
        document.getElementById('mPhoto').src = member.photo;
        document.getElementById('mNameDisplay').innerText = member.name;
        document.getElementById('mPhone').innerText = member.phone;
        document.getElementById('mRoom').innerText = member.room || "তথ্য নেই";
        
        // Update Call button link dynamically
        const cleanPhone = member.phone.replace(/[^0-9+]/g, '');
        document.getElementById('modalCallBtn').href = `tel:${cleanPhone}`;
        
        // Reset and show modal (Slide from left)
        modal.classList.remove('closing');
        modal.classList.add('active');
    }

    function closeModal() {
        // Add closing class (Slide to right)
        modal.classList.add('closing');
        
        // Wait for CSS transition to finish before removing active class
        setTimeout(() => {
            modal.classList.remove('active');
            modal.classList.remove('closing');
        }, 400); // Matches CSS transition duration
    }

    // Close modal on clicking outside overlay
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
