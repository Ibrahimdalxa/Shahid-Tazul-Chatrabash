<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHID TAZUL - Chhatrabash (With Photos)</title>
    <style>
        /* বেসিক স্টাইল */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            border: 2px solid #000;
            padding: 30px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        /* হেডার ও লোগো */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title-area h1 { font-size: 2.2rem; margin: 0; }
        .title-area p { font-size: 1.3rem; margin: 0; font-weight: normal; color: #555; }

        .logo-box {
            width: 80px;
            height: 80px;
            border: 1.5px solid #000;
            border-radius: 50%; /* বৃত্তাকার লোগো বক্স */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f9f9f9;
        }

        .logo-box img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        /* মেম্বার সেকশন */
        .members-label {
            display: inline-block;
            border: 2px solid #000;
            border-radius: 20px;
            padding: 5px 20px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .member-box {
            border: 1.5px solid #000;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .member-box:hover {
            background-color: rgba(0, 0, 0, 0.03);
            transform: translateY(-2px);
        }

        .member-main-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* বৃত্তাকার ছবির বক্স */
        .member-photo-circle {
            width: 55px;
            height: 55px;
            border: 1.5px solid #ccc;
            border-radius: 50%; /* বৃত্তাকার */
            overflow: hidden;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-photo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ছবি যেন কেটে না যায় */
        }

        .name-and-phone {
            display: flex;
            flex-direction: column;
        }

        .name-text { font-size: 1.1rem; font-weight: bold; }
        .phone-text { font-size: 0.85rem; color: #555; }

        /* পপ-আপ (Modal) */
        .modal-overlay {
            visibility: hidden;
            opacity: 0;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        /* পপ-আপে বড় ছবি */
        .modal-photo-circle {
            width: 90px;
            height: 90px;
            border: 2px solid #ccc;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 15px auto;
            background: #eee;
        }

        .modal-photo-circle img { width: 100%; height: 100%; object-fit: cover; }

        .info-block { margin-bottom: 12px; text-align: left; }
        .info-label { font-size: 0.8rem; color: #777; font-weight: bold; text-transform: uppercase; }
        .info-value { font-size: 1rem; color: #000; display: block; margin-top: 2px;}

        .btn-close {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <header class="header">
        <div class="title-area">
            <h1>SHAHID TAZUL</h1>
            <p>chhatrabash</p>
        </div>
        <div class="logo-box">
            <img src="https://cdn-icons-png.flaticon.com/128/17433/17433850.png" alt="Logo">
        </div>
    </header>

    <div class="members-label">Members</div>
    <div class="member-list" id="memberList"></div>
</div>

<div class="modal-overlay" id="popupModal">
    <div class="modal-content">
        <div class="modal-photo-circle">
            <img id="mPhoto" src="" alt="Member Photo">
        </div>
        <h3 id="mNameDisplay" style="margin-top: 0;"></h3>
        
        <div class="info-block"><span class="info-label">মোবাইল নম্বর</span> <span class="info-value" id="mPhone"></span></div>
        <div class="info-block"><span class="info-label">WhatsApp</span> <span class="info-value" id="mWA"></span></div>
        <div class="info-block"><span class="info-label">রুম নম্বর</span> <span class="info-value" id="mRoom">তথ্য নেই</span></div>

        <button class="btn-close" onclick="closeModal()">বন্ধ করুন</button>
    </div>
</div>

<script>
    // আপনার মেম্বারদের লিস্ট (ডামি ছবির লিঙ্ক সহ)
    // পরে নিজের ছবি বসাতে চাইলে photo এর ভেতর আসল লিঙ্ক দিয়ে দিন।
    const members = [
        { name: "কে এম ইমরান হুসাইন", phone: "+880 1743-248248", photo: "https://i.ibb.co.com/671ksQS3/525335176-1544032479914576-8298810793362339152-n.jpg", room: "উত্তর " },
        { name: "আব্দুল গফুর", phone: "+880 1300-254672", photo: "https://i.ibb.co.com/5xBr1yTt/Remove-background-replace-white-202605092338.jpg", room: "দক্ষিণ" },
        { name: "জহিরুল ইসলাম", phone: "+880 1778-975080", photo: "https://i.ibb.co.com/yFq5s4QR/688899946-122157134102965697-937530771562397178-n.jpg", room: "দক্ষিন" },
        { name: "মোঃ তারেক", phone: "+880 1327-750275", photo: "https://i.ibb.co.com/gLXWJ4yC/tarek-web.webp"
        , room: "পশ্চিম" },
        { name: "সজিব সরকার", phone: "+880 1928-853822", photo: "https://i.ibb.co.com/PGxvMNsh/mohamed-hassan-silk-8976449-1920.png", room: "পশ্চিম" },
        { name: "কামাল হোসেন", phone: "+880 1703-172757", photo: "https://i.ibb.co.com/PGxvMNsh/mohamed-hassan-silk-8976449-1920.png", room: "পশ্চিম" },
        { name: "তাহের হোসেন", phone: "+880 1806-419657", photo: "https://i.ibb.co.com/zHNN0Hg5/659207479-909852241951903-3531338251726889684-n.jpg", room: "দক্ষিন" },
        { name: "মোঃ ইব্রাহীম খলিলুল্লাহ", phone: "+8801734365986",photo: "https://i.ibb.co.com/jPVp0RkV/untitled-Flux-Kontext-2026-04-29-18-47-40.png", roo: "উত্তর" },
        { name: "আক্তার হুসাইন", phone: "+8801314196435", photo: "https://i.ibb.co.com/chpKGVK3/images.jpg", room: "" } // খালি বক্সের জন্য ইউজার আইকন
    ];

    const container = document.getElementById('memberList');

    members.forEach(member => {
        const box = document.createElement('div');
        box.className = 'member-box';
        box.onclick = () => openModal(member);
        
        box.innerHTML = `
            <div class="member-main-info">
                <div class="member-photo-circle">
                    <img src="${member.photo}" alt="${member.name}">
                </div>
                <div class="name-and-phone">
                    <span class="name-text">${member.name}</span>
                    <span class="phone-text">${member.phone}</span>
                </div>
            </div>
            <span style="font-size: 0.8rem; color: #888;">#${members.indexOf(member) + 1}</span>
        `;
        container.appendChild(box);
    });

    function openModal(member) {
        if(member.name === "খালি") return;
        
        document.getElementById('mPhoto').src = member.photo;
        document.getElementById('mNameDisplay').innerText = member.name;
        document.getElementById('mPhone').innerText = member.phone;
        document.getElementById('mWA').innerText = member.phone;
        document.getElementById('mRoom').innerText = member.room || "তথ্য নেই";
        document.getElementById('popupModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('popupModal').classList.remove('active');
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('popupModal')) closeModal();
    }
</script>

</body>
</html>
